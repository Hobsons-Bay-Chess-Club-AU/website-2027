name: Import Facebook news drafts

on:
  workflow_dispatch:
  schedule:
    - cron: '11 */6 * * *'

permissions:
  contents: read

concurrency:
  group: hbcc-facebook-news
  cancel-in-progress: false

jobs:
  import-drafts:
    if: vars.FACEBOOK_SCRAPE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Scrape public club posts and save Contentful drafts
        run: npm run news:scrape -- --apply
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_NEWS_MANAGEMENT_TOKEN }}
