name: Build and deploy HBCC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_source:
        description: Published Contentful content, or the saved reference for the GitHub preview
        type: choice
        options: [contentful, reference]
        default: contentful
  repository_dispatch:
    types: [contentful-published]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: hbcc-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'schedule' || vars.CONTENTFUL_REBUILD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and verify the saved reference
        run: npm run build && npm run verify
        env:
          CONTENT_SOURCE: reference

  build:
    needs: validate
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Read the GitHub Pages site configuration
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build and verify the website
        run: npm run build:pages && npm run verify
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CONTENT_SOURCE: ${{ inputs.content_source || 'contentful' }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
          CONTENTFUL_USE_PREVIEW: 'false'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
