name: Build and deploy HBCC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_source:
        description: Published Contentful content, or the saved reference for the GitHub preview
        type: choice
        options: [contentful, reference]
        default: contentful
  repository_dispatch:
    types: [contentful-published]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: hbcc-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'schedule' || vars.CONTENTFUL_REBUILD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and verify both review and current versions
        run: npm run build:pages
        env:
          CONTENT_SOURCE: reference
          SITE_URL: https://hobsons-bay-chess-club-au.github.io
          SITE_BASE_PATH: /website-2027/

  vercel:
    needs: validate
    if: vars.VERCEL_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Deploy the approved Astro website to Vercel
        run: npm run deploy:vercel
        env:
          VERCEL_API_KEY: ${{ secrets.VERCEL_API_KEY }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

  build:
    needs: validate
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Read the GitHub Pages site configuration
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build and verify the current website and V2 review
        run: npm run build:pages
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CONTENT_SOURCE: ${{ inputs.content_source || vars.CONTENT_SOURCE || 'contentful' }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
          CONTENTFUL_USE_PREVIEW: 'false'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
